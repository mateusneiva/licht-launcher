[package]
name = "licht-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
futures-util = "=0.3.34"
regex = "=1.13.1"
reqwest = { version = "=0.13.5", default-features = false, features = ["json", "rustls", "stream"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
sha1 = "=0.11.0"
thiserror = "=2.0.21"
tokio = { version = "=1.53.2", features = ["fs", "io-util", "rt", "sync", "time"] }
tokio-util = { version = "=0.7.19", default-features = false, features = ["io"] }
tracing = "=0.1.44"

[dev-dependencies]
tokio = { version = "=1.53.2", features = ["macros", "net", "rt-multi-thread"] }
